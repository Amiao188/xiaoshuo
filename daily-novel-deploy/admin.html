<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>内容管理 · 日更小说馆</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;500;600;700&family=Source+Han+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header><a href="index.html"><span>日</span>日更小说馆</a><div><strong id="admin-email"></strong><button id="logout-button">退出登录</button></div></header>
  <main>
    <section class="heading"><p>EDITOR'S DESK</p><h1>内容管理</h1><span>上传当天短篇小说，发布后读者端会立即更新。</span></section>
    <section class="panel upload-panel"><form id="publish-form"><div class="form-row"><label>发布日期<input id="publish-date" type="date" required></label><label class="file-picker">选择 TXT 文件<input id="file-input" type="file" accept=".txt,text/plain" multiple required><small id="file-count">尚未选择文件</small></label></div><div id="file-list" class="file-list"></div><p class="message" id="publish-message" aria-live="polite"></p><button type="submit">发布选中的小说</button></form></section>
    <section class="content-head"><div><p>LIBRARY</p><h2>已发布内容</h2></div><button id="refresh-button" class="quiet">刷新列表</button></section>
    <section id="story-list" class="story-list"></section>
  </main>
  <script src="admin.js"></script>
</body>
</html>
