<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#182526"><title>内容管理 · 日更小说馆</title><link rel="stylesheet" href="admin.css"></head>
<body><header class="admin-header"><a class="admin-brand" href="index.html"><span>日</span><strong>日更小说馆</strong></a><div class="admin-user"><span id="admin-email">管理员</span><button id="logout-button">退出登录</button></div></header><main><section class="admin-intro"><p class="eyebrow">EDITOR'S DESK</p><h1>内容管理</h1><p>上传今天的故事，维护你的短篇书架。</p></section><section class="analytics-panel" aria-label="独立访客统计"><div><small>今日独立访客</small><strong id="today-visits">--</strong></div><div><small>近 30 天独立访客</small><strong id="month-visits">--</strong></div><div class="analytics-days" id="analytics-days"></div></section><section class="admin-grid"><section class="panel upload-panel"><div class="panel-heading"><p class="eyebrow">NEW STORIES</p><h2>发布小说</h2><span>TXT 文件会按照发布日期进入对应书架。</span></div><form id="publish-form"><div class="form-row"><label>发布日期<input id="publish-date" type="date" required></label><label>本批默认标签<select id="default-tag" required></select><small>每篇小说只能有一个标签；未匹配的文件使用此标签。</small></label></div><div class="form-row"><label class="file-picker"><strong>选择 TXT 文件</strong><input id="file-input" type="file" accept=".txt,text/plain" multiple required><small id="file-count">点击选择，可多选</small></label><label class="file-picker"><strong>导入标签清单</strong><input id="tag-map-input" type="file" accept=".csv,text/csv"><small id="tag-map-status">可选，上传下载器生成的标签清单.csv</small></label></div><div id="file-list" class="file-list"></div><p class="message" id="publish-message" aria-live="polite"></p><button class="action-button" type="submit">发布选中的小说 <span>↗</span></button></form></section><section class="panel support-panel"><div class="panel-heading"><p class="eyebrow">DEVELOPER NOTE</p><h2>开发者有话说</h2><span>显示在读者端首页的折叠公告里。</span></div><form id="support-qr-form"><label>留言<textarea id="developer-note-input" maxlength="1000" placeholder="写给读者的话，最多 1000 字"></textarea></label><label class="file-picker"><strong>选择收款码图片</strong><input id="support-qr-input" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><small>可选，最大 1 MB</small></label><div class="support-actions"><button class="action-button" type="submit">保存内容</button><button type="button" class="quiet" id="remove-support-qr" hidden>移除收款码</button></div><p class="message" id="support-qr-message" aria-live="polite"></p></form><img id="support-qr-preview" class="support-qr-preview" alt="当前收款码预览" hidden></section></section><section class="panel danger-panel"><div class="panel-heading"><p class="eyebrow">MAINTENANCE</p><h2>清空某日内容</h2><span>仅在需要重新上传某一天的全部内容时使用。</span></div><form id="delete-date-form"><div class="delete-row"><label>选择日期<input id="delete-date" type="date" required></label><button type="submit">永久删除这一天</button></div><p class="message" id="delete-date-message" aria-live="polite"></p></form></section><section class="content-section"><div class="content-head"><div><p class="eyebrow">LIBRARY</p><h2>已发布内容</h2></div><button id="refresh-button" class="quiet">刷新列表</button></div><section id="story-list" class="story-list"></section></section><section class="content-section"><div class="content-head"><div><p class="eyebrow">READER'S WALL</p><h2>读者留言</h2></div><button id="refresh-messages" class="quiet">刷新留言</button></div><section id="admin-message-list" class="admin-message-list"></section></section></main><script src="admin.js"></script></body></html>
