<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>内容管理 · 日更小说馆</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;500;600;700&family=Source+Han+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header><a href="index.html"><span>日</span>日更小说馆</a><div><strong id="admin-email"></strong><button id="logout-button">退出登录</button></div></header>
  <main>
    <section class="heading"><p>EDITOR'S DESK</p><h1>内容管理</h1><span>上传当天短篇小说，发布后读者端会立即更新。</span></section>
    <section class="analytics-panel" aria-label="独立访客统计"><div><small>今日独立访客</small><strong id="today-visits">--</strong></div><div><small>近 30 天独立访客</small><strong id="month-visits">--</strong></div><div class="analytics-days" id="analytics-days"></div></section>
    <section class="panel support-panel"><div class="support-copy"><p>READER SUPPORT</p><h2>收款码</h2><span>上传后会显示在每篇小说的正文末尾。再次上传可直接替换原来的收款码。</span></div><form id="support-qr-form"><label class="file-picker">选择收款码图片<input id="support-qr-input" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><small>支持 PNG、JPG、WebP、GIF，最大 1 MB。</small></label><div class="support-actions"><button type="submit">保存收款码</button><button type="button" class="quiet" id="remove-support-qr" hidden>移除收款码</button></div><p class="message" id="support-qr-message" aria-live="polite"></p></form><img id="support-qr-preview" class="support-qr-preview" alt="当前收款码预览" hidden></section>
    <section class="panel upload-panel"><form id="publish-form"><div class="form-row"><label>发布日期<input id="publish-date" type="date" required></label><label>本批默认标签<select id="default-tag" required></select><small>每篇小说只能有一个标签；未在标签清单中匹配到的文件使用此标签。</small></label></div><div class="form-row"><label class="file-picker">选择 TXT 文件<input id="file-input" type="file" accept=".txt,text/plain" multiple required><small id="file-count">尚未选择文件</small></label><label class="file-picker">导入标签清单（可选）<input id="tag-map-input" type="file" accept=".csv,text/csv"><small id="tag-map-status">上传下载器生成的标签清单.csv，可自动逐篇匹配标签。</small></label></div><div id="file-list" class="file-list"></div><p class="message" id="publish-message" aria-live="polite"></p><button type="submit">发布选中的小说</button></form></section>
    <section class="panel danger-panel"><form id="delete-date-form"><div class="form-row"><label>清空某日小说<input id="delete-date" type="date" required><small>会永久删除当天的全部小说，无法恢复。</small></label><div><p class="danger-copy">仅在需要重新上传某一天的全部内容时使用。</p><button type="submit">永久删除所选日期</button></div></div><p class="message" id="delete-date-message" aria-live="polite"></p></form></section>
    <section class="content-head"><div><p>LIBRARY</p><h2>已发布内容</h2></div><button id="refresh-button" class="quiet">刷新列表</button></section>
    <section id="story-list" class="story-list"></section>
    <section class="content-head messages-head"><div><p>READER MESSAGES</p><h2>读者留言</h2></div><button id="refresh-messages" class="quiet">刷新留言</button></section>
    <section id="admin-message-list" class="story-list message-admin-list"></section>
  </main>
  <script src="admin.js"></script>
</body>
</html>
